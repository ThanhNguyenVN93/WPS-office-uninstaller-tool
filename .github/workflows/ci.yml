name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Materialize example config files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.config.example | Where-Object { $_.FullName -notmatch '\\(bin|obj|\.claude|\.vs)\\' } | ForEach-Object {
            $dest = $_.FullName -replace '\.example$', ''
            if (-not (Test-Path $dest)) { Copy-Item $_.FullName $dest }
          }
      - name: Restore and build
        shell: pwsh
        env:
          FX_REF: C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8
        run: |
          $slnRoot = Get-ChildItem -Filter *.sln
          $csprojRoot = Get-ChildItem -Filter *.csproj
          if ($slnRoot) {
            $targets = $slnRoot
          } elseif ($csprojRoot) {
            $targets = $csprojRoot
          } else {
            $targets = Get-ChildItem -Filter *.csproj -Recurse | Where-Object { $_.FullName -notmatch '\\(bin|obj|\.claude|\.vs)\\' }
          }
          foreach ($t in $targets) {
            Write-Host "=== Building $($t.FullName) ==="
            nuget restore $t.FullName
            msbuild $t.FullName /t:Restore /p:Configuration=Release
            msbuild $t.FullName /p:Configuration=Release /p:FrameworkPathOverride="$env:FX_REF"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
