name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Materialize example config files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.config.example | Where-Object { $_.FullName -notmatch '\\(bin|obj|\.claude|\.vs)\\' } | ForEach-Object {
            $dest = $_.FullName -replace '\.example$', ''
            if (-not (Test-Path $dest)) { Copy-Item $_.FullName $dest }
          }
      - name: Create placeholders for missing embedded resource files
        shell: pwsh
        run: |
          # Some repos reference personal/large assets (donate QR images,
          # installer binaries) from .resx ResXFileRef entries or <None>/
          # <EmbeddedResource> csproj items, deliberately gitignored or
          # otherwise not committed. CI only needs the build to compile, not
          # the real asset, so synthesize a tiny placeholder at any such
          # path that's still missing after checkout.
          $placeholder = [byte[]](0xFF,0xD8,0xFF,0xE0,0x00,0x10,0x4A,0x46,0x49,0x46,0x00,0x01,0x01,0x00,0x00,0x01,0x00,0x01,0x00,0x00,0xFF,0xDB,0x00,0x43,0x00,0x03,0x02,0x02,0x02,0x02,0x02,0x03,0x02,0x02,0x02,0x03,0x03,0x03,0x03,0x04,0x06,0x04,0x04,0x04,0x04,0x04,0x08,0x06,0x06,0x05,0x06,0x09,0x08,0x0A,0x0A,0x09,0x08,0x09,0x09,0x0A,0x0C,0x0F,0x0C,0x0A,0x0B,0x0E,0x0B,0x09,0x09,0x0D,0x11,0x0D,0x0E,0x0F,0x10,0x10,0x11,0x10,0x0A,0x0C,0x12,0x13,0x12,0x10,0x13,0x0F,0x10,0x10,0x10,0xFF,0xC9,0x00,0x0B,0x08,0x00,0x01,0x00,0x01,0x01,0x01,0x11,0x00,0xFF,0xCC,0x00,0x06,0x00,0x10,0x10,0x05,0xFF,0xDA,0x00,0x08,0x01,0x01,0x00,0x00,0x3F,0x00,0xD2,0xCF,0x20,0xFF,0xD9)
          $paths = New-Object System.Collections.Generic.HashSet[string]
          Get-ChildItem -Recurse -Filter *.resx | Where-Object { $_.FullName -notmatch '\\(bin|obj|\.claude|\.vs)\\' } | ForEach-Object {
            $resxDir = $_.Directory.FullName
            $xml = [xml](Get-Content $_.FullName -Raw)
            foreach ($data in $xml.root.data) {
              if ($data.value -and $data.value -match '^([^;]+);') {
                $rel = $Matches[1]
                try {
                  $full = [System.IO.Path]::GetFullPath((Join-Path $resxDir $rel))
                  [void]$paths.Add($full)
                } catch {}
              }
            }
          }
          Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.FullName -notmatch '\\(bin|obj|\.claude|\.vs)\\' } | ForEach-Object {
            $projDir = $_.Directory.FullName
            $xml = [xml](Get-Content $_.FullName -Raw)
            $includes = @()
            $includes += $xml.Project.ItemGroup.EmbeddedResource | ForEach-Object { $_.Include }
            $includes += $xml.Project.ItemGroup.None | ForEach-Object { $_.Include }
            foreach ($inc in $includes) {
              if ($inc) {
                try {
                  $full = [System.IO.Path]::GetFullPath((Join-Path $projDir $inc))
                  [void]$paths.Add($full)
                } catch {}
              }
            }
          }
          foreach ($p in $paths) {
            if (-not (Test-Path $p)) {
              $dir = Split-Path $p -Parent
              if ($dir -and -not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
              Write-Host "Placeholder: $p"
              [System.IO.File]::WriteAllBytes($p, $placeholder)
            }
          }
      - name: Restore and build
        shell: pwsh
        env:
          FX_REF: C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8
        run: |
          $slnRoot = Get-ChildItem -Filter *.sln
          $csprojRoot = Get-ChildItem -Filter *.csproj
          if ($slnRoot) {
            $targets = $slnRoot
          } elseif ($csprojRoot) {
            $targets = $csprojRoot
          } else {
            $targets = Get-ChildItem -Filter *.csproj -Recurse | Where-Object { $_.FullName -notmatch '\\(bin|obj|\.claude|\.vs)\\' }
          }
          foreach ($t in $targets) {
            Write-Host "=== Building $($t.FullName) ==="
            nuget restore $t.FullName -PackagesDirectory (Join-Path $t.DirectoryName "packages")
            msbuild $t.FullName /t:Restore /p:Configuration=Release
            msbuild $t.FullName /p:Configuration=Release /p:FrameworkPathOverride="$env:FX_REF"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
